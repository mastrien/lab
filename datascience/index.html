<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataLab 🧪 - Laboratório Interativo de Ciência de Dados</title>
  <meta name="description" content="Plataforma de ensino e experimentação interativa em Ciência de Dados, Mineração de Dados (KDD) e Machine Learning.">

  <!-- Tailwind CSS CDN com suporte a Dark Mode via classe -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- KaTeX para Notação Matemática LaTeX de Alta Performance -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200 selection:bg-indigo-500 selection:text-white antialiased font-sans">
  <!-- Container da SPA -->
  <div id="app" class="min-h-screen flex flex-col justify-between"></div>

  <!-- Ponto de Entrada JavaScript Modular -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
